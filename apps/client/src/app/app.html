<main class="flex-grow flex items-center justify-center p-4 md:p-8">
  <div
    *ngIf="profile; else loading"
    class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all duration-300 hover:shadow-2xl"
  >
    <div class="relative bg-gradient-to-r from-blue-600 to-indigo-700 p-6 sm:p-10 text-white">
      <div class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-6">
        <div
          class="h-24 w-24 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-3xl font-bold border-2 border-white/40 shadow-inner"
        >
          {{ profile.name.charAt(0) }}
        </div>

        <div class="text-center sm:text-left flex-grow">
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">{{ profile.name }}</h1>
          <p
            class="text-blue-100 font-medium text-lg mt-1 inline-flex items-center bg-white/10 px-3 py-1 rounded-full text-sm backdrop-blur-sm"
          >
            <span class="w-2 h-2 rounded-full bg-green-400 mr-2 animate-pulse"></span>
            {{ profile.role }}
          </p>
        </div>

        <div class="pt-4 sm:pt-0">
          <button
            (click)="loadData()"
            class="inline-flex items-center space-x-2 bg-white text-indigo-700 hover:bg-indigo-50 active:scale-95 font-semibold text-sm px-4 py-2.5 rounded-xl shadow-md transition-all duration-200"
          >
            <svg
              class="w-4 h-4 animate-spin-slow"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
              ></path>
            </svg>
            <span>Update</span>
          </button>
        </div>
      </div>
    </div>

    <div class="p-6 sm:p-10 space-y-8">
      <div>
        <h2
          class="text-xl font-bold text-slate-900 mb-4 flex items-center space-x-2 tracking-tight"
        >
          <svg
            class="w-5 h-5 text-indigo-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
            ></path>
          </svg>
          <span>Technical Skills</span>
        </h2>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          <div
            *ngFor="let skill of profile.skills"
            class="bg-slate-50 border border-slate-200 hover:border-indigo-200 hover:bg-indigo-50/50 rounded-xl p-3 text-center transition-all duration-200 group"
          >
            <span class="text-sm font-semibold text-slate-700 group-hover:text-indigo-700">
              {{ skill }}
            </span>
          </div>
        </div>
      </div>

      <div
        class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2"
      >
        <p>Data synchronized in real time from MongoDB Atlas</p>
        <p class="font-medium text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-md">
          MEAN Stack Architecture
        </p>
      </div>
    </div>
  </div>

  <ng-template #loading>
    <div
      class="flex flex-col items-center justify-center space-y-4 bg-white p-12 rounded-2xl shadow-xl border border-slate-100 max-w-sm w-full text-center"
    >
      <div
        class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"
      ></div>
      <div>
        <h3 class="text-lg font-semibold text-slate-800">Loading portafolio...</h3>
        <p class="text-sm text-slate-500 mt-1">Connecting to the API and MongoDB</p>
      </div>
    </div>
  </ng-template>
</main>
